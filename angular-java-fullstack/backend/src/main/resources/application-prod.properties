# Supply a PostgreSQL JDBC URL and credentials through the hosting environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# A small pool suits one F1 instance. Release idle connections and avoid SQL
# keepalive queries so the free PostgreSQL compute can suspend between games.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# Apply reviewed migrations in a separate release step.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
