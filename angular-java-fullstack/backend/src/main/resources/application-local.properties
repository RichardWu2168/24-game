# This profile connects only to the project's local PostgreSQL instance.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:math24_java}
spring.datasource.username=${POSTGRES_USER:math24}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Local Angular development server; override with a comma-separated origin list.
math24.api.allowed-origins=${MATH24_ALLOWED_ORIGINS:http://localhost:4200}
