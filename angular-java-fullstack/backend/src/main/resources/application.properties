spring.application.name=math24-api
server.port=${PORT:8080}

# Configure a development database explicitly before starting the application.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Reject ambiguous command payloads instead of coercing strings or decimals.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.read.strict-duplicate-detection=true
spring.jackson.deserialization.fail-on-trailing-tokens=true

# Comma-separated exact Angular origins; same-origin access needs no CORS setting.
math24.api.allowed-origins=${MATH24_ALLOWED_ORIGINS:}
