name: Java Game API

on:
  pull_request:
    branches: [main]
    paths:
      - 'angular-java-fullstack/backend/**'
      - 'angular-java-fullstack/scripts/Invoke-Migrations.ps1'
      - '.github/workflows/java-game-ci.yml'
  push:
    branches: [main]
    paths:
      - 'angular-java-fullstack/backend/**'
      - 'angular-java-fullstack/scripts/Invoke-Migrations.ps1'
      - '.github/workflows/java-game-ci.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the checked main commit to the Java Azure F1 app'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test PostgreSQL migrations and Java API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: angular-java-fullstack/backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: math24_java_ci
          POSTGRES_USER: math24
          POSTGRES_PASSWORD: math24_ci_disposable_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U math24 -d math24_java_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/math24_java_ci
      SPRING_DATASOURCE_USERNAME: math24
      SPRING_DATASOURCE_PASSWORD: math24_ci_disposable_password
      SPRING_FLYWAY_ENABLED: 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Require main for a production release
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Select main when requesting a production deployment.'
            exit 1
          fi

      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
          cache: maven
          cache-dependency-path: angular-java-fullstack/backend/pom.xml

      - name: Verify the release migration command on disposable PostgreSQL
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/math24_java_ci
          FLYWAY_USER: math24
          FLYWAY_PASSWORD: math24_ci_disposable_password
        run: ./mvnw -B -ntp -Pdatabase-migrations -Dflyway.cleanDisabled=true flyway:migrate flyway:validate

      - name: Run all Java checks and build the executable JAR
        run: ./mvnw -B -ntp clean verify

      - name: Prepare the release artifact
        run: cp target/math24-api-*.jar "$RUNNER_TEMP/math24-api.jar"

      - name: Save the checked JAR
        uses: actions/upload-artifact@v7
        with:
          name: math24-java-api
          path: ${{ runner.temp }}/math24-api.jar
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Migrate Neon and deploy Java to Azure F1
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: java-production
    concurrency:
      group: math24-java-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      AZURE_JAVA_CLIENT_ID: ${{ vars.AZURE_JAVA_CLIENT_ID }}
      AZURE_JAVA_TENANT_ID: ${{ vars.AZURE_JAVA_TENANT_ID }}
      AZURE_JAVA_SUBSCRIPTION_ID: ${{ vars.AZURE_JAVA_SUBSCRIPTION_ID }}
      AZURE_JAVA_RESOURCE_GROUP: ${{ vars.AZURE_JAVA_RESOURCE_GROUP }}
      AZURE_JAVA_WEBAPP_NAME: ${{ vars.AZURE_JAVA_WEBAPP_NAME }}
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Checkout the same checked commit
        uses: actions/checkout@v7

      - name: Validate release settings without displaying credentials
        env:
          FLYWAY_URL: ${{ secrets.JAVA_FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.JAVA_FLYWAY_USER }}
          FLYWAY_PASSWORD: ${{ secrets.JAVA_FLYWAY_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import parse_qs, urlsplit

          required = (
              'AZURE_JAVA_CLIENT_ID', 'AZURE_JAVA_TENANT_ID',
              'AZURE_JAVA_SUBSCRIPTION_ID', 'AZURE_JAVA_RESOURCE_GROUP',
              'AZURE_JAVA_WEBAPP_NAME', 'FLYWAY_URL', 'FLYWAY_USER', 'FLYWAY_PASSWORD',
          )
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing java-production settings: ' + ', '.join(missing))

          url = os.environ['FLYWAY_URL']
          if not url.startswith('jdbc:postgresql://'):
              raise SystemExit('JAVA_FLYWAY_URL must be a PostgreSQL JDBC URL.')
          parsed = urlsplit(url[5:])
          query = parse_qs(parsed.query, keep_blank_values=True)
          if not parsed.hostname or not parsed.path.strip('/'):
              raise SystemExit('JAVA_FLYWAY_URL must include a database hostname and database name.')
          if parsed.username or parsed.password or {'user', 'password'} & {key.lower() for key in query}:
              raise SystemExit('Supply migration credentials through separate secrets, not the JDBC URL.')
          if '-pooler.' in parsed.hostname.lower():
              raise SystemExit('Use a direct Neon hostname for migrations, not its pooled hostname.')
          if query.get('sslmode', [''])[0] not in ('require', 'verify-ca', 'verify-full') and query.get('ssl', [''])[0] != 'true':
              raise SystemExit('The production migration JDBC URL must enable TLS.')
          print('Required release settings are present.')
          PY

      - name: Log in to Azure using OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_JAVA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_JAVA_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_JAVA_SUBSCRIPTION_ID }}

      - name: Verify the existing Java 25 app and free plan before migrating
        id: target
        run: |
          plan_id=$(az webapp show --name "$AZURE_JAVA_WEBAPP_NAME" --resource-group "$AZURE_JAVA_RESOURCE_GROUP" --query serverFarmId --output tsv)
          sku=$(az appservice plan show --ids "$plan_id" --query sku.name --output tsv)
          if [[ "${sku^^}" != 'F1' ]]; then
            echo '::error::The selected app is not on F1. This release requires the agreed free hosting tier.'
            exit 1
          fi

          stack=$(az webapp config show --name "$AZURE_JAVA_WEBAPP_NAME" --resource-group "$AZURE_JAVA_RESOURCE_GROUP" --query '[linuxFxVersion,javaVersion,javaContainer]' --output json)
          JAVA_STACK="$stack" python - <<'PY'
          import json, os, re
          linux, version, container = json.loads(os.environ['JAVA_STACK'])
          linux_java = bool(re.match(r'^JAVA\|25(?:[-.]|$)', linux or '', re.IGNORECASE))
          windows_java = not linux and bool(re.match(r'^25(?:[.]|$)', version or '')) and (container or '').upper() in ('JAVA', 'JAVA SE')
          if not (linux_java or windows_java):
              raise SystemExit('The selected Azure app must use the Java SE 25 stack.')
          PY

          profile=$(az webapp config appsettings list --name "$AZURE_JAVA_WEBAPP_NAME" --resource-group "$AZURE_JAVA_RESOURCE_GROUP" --query "[?name=='SPRING_PROFILES_ACTIVE'].value | [0]" --output tsv)
          if [[ "$profile" != 'prod' ]]; then
            echo '::error::Set SPRING_PROFILES_ACTIVE=prod on the Java Azure app first.'
            exit 1
          fi

          setting_names=$(az webapp config appsettings list --name "$AZURE_JAVA_WEBAPP_NAME" --resource-group "$AZURE_JAVA_RESOURCE_GROUP" --query "[?value != '' && value != null].name" --output json)
          APPSETTING_NAMES="$setting_names" python - <<'PY'
          import json, os
          configured = set(json.loads(os.environ['APPSETTING_NAMES']))
          required = {'SPRING_DATASOURCE_URL', 'SPRING_DATASOURCE_USERNAME', 'SPRING_DATASOURCE_PASSWORD', 'MATH24_ALLOWED_ORIGINS'}
          missing = sorted(required - configured)
          if missing:
              raise SystemExit('Configure the Java Azure app settings first: ' + ', '.join(missing))
          PY

          hostname=$(az webapp show --name "$AZURE_JAVA_WEBAPP_NAME" --resource-group "$AZURE_JAVA_RESOURCE_GROUP" --query defaultHostName --output tsv)
          if [[ ! "$hostname" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*[.]azurewebsites[.]net$ ]]; then
            echo '::error::Azure did not return a valid default application hostname.'
            exit 1
          fi
          printf 'base_url=https://%s\n' "$hostname" >> "$GITHUB_OUTPUT"
          echo 'Verified Java SE 25 on F1 with the production profile.'

      - name: Install Java 25 for the controlled migration
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
          cache: maven
          cache-dependency-path: angular-java-fullstack/backend/pom.xml

      - name: Download the checked JAR
        uses: actions/download-artifact@v8
        with:
          name: math24-java-api
          path: java-release

      - name: Apply and validate the reviewed production migrations
        working-directory: angular-java-fullstack/backend
        env:
          FLYWAY_URL: ${{ secrets.JAVA_FLYWAY_URL }}
          FLYWAY_USER: ${{ secrets.JAVA_FLYWAY_USER }}
          FLYWAY_PASSWORD: ${{ secrets.JAVA_FLYWAY_PASSWORD }}
        run: ./mvnw -B -ntp -Pdatabase-migrations -Dflyway.cleanDisabled=true flyway:migrate flyway:validate

      - name: Deploy the Java JAR
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_JAVA_WEBAPP_NAME }}
          package: java-release/math24-api.jar

      - name: Check the deployed API health
        env:
          API_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 10 --max-time 60 "$API_BASE_URL/actuator/health" --output "$RUNNER_TEMP/math24-health.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          response = json.loads((Path(os.environ['RUNNER_TEMP']) / 'math24-health.json').read_text())
          if response.get('status') != 'UP':
              raise SystemExit('The deployed API did not report UP.')
          print('The deployed API and its database report UP.')
          PY
