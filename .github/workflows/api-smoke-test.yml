name: Production API Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/api-smoke-test.yml'
      
jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check API health
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 \
            --retry-delay 5 \
            https://twentyfourgame-api-gghuafa9bcewg3c0.canadaeast-01.azurewebsites.net/health

      - name: Check database health
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 \
            --retry-delay 5 \
            https://twentyfourgame-api-gghuafa9bcewg3c0.canadaeast-01.azurewebsites.net/health/db

      - name: Create game session
        run: |
          curl --fail-with-body --show-error --silent \
            --max-time 30 \
            -X POST \
            https://twentyfourgame-api-gghuafa9bcewg3c0.canadaeast-01.azurewebsites.net/api/GameSessions